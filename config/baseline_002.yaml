# baseline_002 — Phase 2 microstructure features added.
#
# Builds on baseline_001 by adding 34 Numba JIT-accelerated microstructure
# features from src/features/micro_features.py.  Total feature count: 58
# (24 base + 34 micro).

# ── Experiment metadata ──────────────────────────────────────────────────────
experiment:
  name: "baseline_002"
  description: >
    baseline_001 + 34 microstructure features (triplet imbalance, price/depth
    aggregates, far/near NaN-preserving, volume/flow dynamics).  Numba JIT
    kernels for triplet imbalance and row-wise statistics.
  created: "2026-05-21"

# ── Data ─────────────────────────────────────────────────────────────────────
data:
  train_path: "data/train.csv"

# ── Preprocessing ────────────────────────────────────────────────────────────
preprocessing:
  target_winsorization: 30
  drop_missing_target: true
  drop_corrupted_rows: true

# ── Cross-validation ─────────────────────────────────────────────────────────
cv:
  n_splits: 5
  purge_gap: 1
  date_col: "date_id"

# ── Features ─────────────────────────────────────────────────────────────────
features:
  categorical:
    - stock_id
  numerical:
    - seconds_in_bucket
    - imbalance_size
    - imbalance_buy_sell_flag
    - reference_price
    - matched_size
    - bid_price
    - bid_size
    - ask_price
    - ask_size
    - wap
  conditional:
    - far_price
    - near_price
  derived:
    - bid_ask_spread
    - spread_pct
    - wap_ref_diff
    - price_momentum
    - imbalance_ratio
    - size_imbalance
    - depth_total
    - far_price_avail
    - near_price_avail
    - far_near_spread
    - far_near_mean
  micro:
    # Triplet Imbalance (8)
    - tri_flow
    - tri_price
    - tri_match
    - tri_ref_bid
    - tri_exec
    - tri_ref_ask
    - tri_depth
    - tri_term
    # Price / Depth (8)
    - micro_price
    - mid_price
    - price_spread
    - market_urgency
    - wap_micro_diff
    - book_slope
    - signed_imb
    - order_intensity
    # Aggregate Statistics (8)
    - price_mean
    - price_std
    - price_skew
    - price_kurt
    - size_mean
    - size_std
    - size_skew
    - size_kurt
    # Far / Near Enhanced (5)
    - far_price_nan
    - near_price_nan
    - far_near_spread_nan
    - far_to_mid
    - near_to_mid
    # Volume / Flow (5)
    - volume_intensity
    - imb_flow
    - log_quote_imb
    - bid_ask_size_ratio
    - matched_depth_ratio

# ── Model ────────────────────────────────────────────────────────────────────
model:
  type: "lightgbm"
  params:
    objective: "regression"
    metric: "mae"
    boosting_type: "gbdt"
    n_estimators: 1000
    learning_rate: 0.05
    num_leaves: 128
    max_depth: -1
    min_data_in_leaf: 100
    feature_fraction: 0.7
    bagging_fraction: 0.7
    bagging_freq: 1
    lambda_l1: 0.1
    lambda_l2: 1.0
    random_state: 42
    n_jobs: -1
    verbosity: -1

  early_stopping_rounds: 50
  eval_metric: "mae"

# ── Output ───────────────────────────────────────────────────────────────────
output:
  dir: "outputs/baseline_002"
  save_oof: true
  save_metrics: true
  save_feature_list: true
