# hpo_001 — Phase 4 hyperparameter optimisation for LightGBM.
#
# Uses Optuna with 30 trials and 5-fold purged walk-forward CV.
# Search space v2 — mixed float/int/categorical to give TPE a continuous
# surface to explore (pure categorical space collapsed to repetitive sampling).

experiment:
  name: "hpo_001"
  description: >
    Phase 4 HPO sweep — 30 Optuna trials over 8 LightGBM hyperparameters,
    evaluated with 5-fold PurgedGroupTimeSeriesSplit on the full 90-feature
    matrix from baseline_003.  Mixed float/int/categorical search space.
  created: "2026-05-22"

# ── Data ─────────────────────────────────────────────────────────────────────
data:
  train_path: "data/train.csv"
  stock_fraction: 0.5   # HPO runs on a random 50% of stocks to keep memory manageable

# ── Preprocessing ────────────────────────────────────────────────────────────
preprocessing:
  target_winsorization: 30
  drop_missing_target: true
  drop_corrupted_rows: true

# ── Cross-validation ─────────────────────────────────────────────────────────
cv:
  n_splits: 3
  purge_gap: 1
  date_col: "date_id"

# ── Search strategy ──────────────────────────────────────────────────────────
search:
  n_trials: 30
  optimization_metric: "mae"
  sampler: "tpe"
  pruner: "median"

# ── Search space (mixed types — gives TPE a continuous surface) ──────────────
search_space:
  learning_rate:
    type: "float"
    low: 0.001
    high: 0.1
    log: true
  num_leaves:
    type: "int"
    low: 16
    high: 256
    log: false
  feature_fraction:
    type: "float"
    low: 0.5
    high: 1.0
    log: false
  bagging_fraction:
    type: "float"
    low: 0.5
    high: 1.0
    log: false
  bagging_freq:
    type: "categorical"
    values: [1, 3, 5]
  min_child_samples:
    type: "int"
    low: 10
    high: 200
    log: false
  lambda_l1:
    type: "float"
    low: 0.0
    high: 10.0
    log: false
  lambda_l2:
    type: "float"
    low: 0.0
    high: 10.0
    log: false

# ── Fixed model parameters (not searched) ────────────────────────────────────
fixed_params:
  objective: "regression"
  metric: "mae"
  boosting_type: "gbdt"
  n_estimators: 400
  max_depth: -1
  random_state: 42
  n_jobs: 2
  verbosity: -1

# ── Output ───────────────────────────────────────────────────────────────────
output:
  log_path: "outputs/hpo_log.csv"
  best_config_path: "config/baseline_004.yaml"
